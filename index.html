<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b6cff">
<title>Fitnes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b6cff'/%3E%3Cpath d='M10 9v14M22 9v14M6 12v8M26 12v8M10 16h12' stroke='white' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5fa;
    --card: #ffffff;
    --fg: #191b24;
    --muted: #8b8fa0;
    --line: #eceef5;
    --field: #f1f2f8;
    --a: #5b6cff;
    --danger: #ef4444;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101218;
      --card: #1a1d26;
      --fg: #eceef6;
      --muted: #7d8196;
      --line: #262a36;
      --field: #232734;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    padding: 16px 16px 56px;
  }
  main { max-width: 460px; margin: 0 auto; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }

  /* Glava */
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .burger {
    width: 42px; height: 42px; flex: none;
    border: 0; border-radius: 12px;
    background: var(--card);
    display: grid; place-items: center;
    cursor: pointer;
  }
  .burger svg { width: 22px; height: 22px; }
  .titles { flex: 1; min-width: 0; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .logo {
    width: 42px; height: 42px; flex: none;
    border-radius: 12px;
    background: var(--a);
    color: #fff;
    display: grid; place-items: center;
    transition: background .2s;
  }
  .logo svg { width: 24px; height: 24px; }

  /* Meni */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    opacity: 0; visibility: hidden;
    transition: opacity .2s, visibility .2s;
    z-index: 10;
  }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: 270px; max-width: 82vw;
    background: var(--card);
    padding: 20px 14px;
    transform: translateX(-100%); visibility: hidden;
    transition: transform .22s ease, visibility .22s;
    z-index: 11;
    display: flex; flex-direction: column; gap: 4px;
  }
  body.menu-open .scrim { opacity: 1; visibility: visible; }
  body.menu-open .drawer { transform: none; visibility: visible; }
  .drawer .brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 18px; font-weight: 700; font-size: 18px; }
  .drawer .brand .logo { background: #5b6cff; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 12px;
    border: 0; border-radius: 12px;
    background: transparent;
    text-align: left; cursor: pointer;
    font-size: 16px;
  }
  .nav-item svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
  .nav-item[aria-current="page"] { background: var(--field); font-weight: 600; }
  .nav-item[aria-current="page"] svg { color: var(--ic, var(--a)); }
  .drawer hr { border: 0; border-top: 1px solid var(--line); margin: 10px 6px; width: calc(100% - 12px); }
  .drawer .foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--muted); }

  /* Zavihki dni */
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 10px 0;
    border: 0; border-radius: 12px;
    background: var(--card);
    color: var(--muted);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--tc); color: #fff; font-weight: 700; }

  /* Trening */
  .day-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
  .day-title { font-size: 18px; font-weight: 700; color: var(--a); }
  .progress { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 4px; background: var(--line); margin-bottom: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--a); border-radius: 4px; transition: width .2s; }

  .card { background: var(--card); border-radius: 18px; padding: 4px 16px; }
  .row { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .top { display: flex; align-items: center; gap: 12px; }
  .check {
    appearance: none; -webkit-appearance: none;
    width: 26px; height: 26px; flex: none;
    border: 2px solid var(--line);
    border-radius: 8px;
    margin: 0; cursor: pointer;
    display: grid; place-content: center;
    background: transparent;
  }
  .check:checked { background: var(--a); border-color: var(--a); }
  .check:checked::after {
    content: ""; width: 6px; height: 12px;
    border: solid #fff; border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .name { flex: 1; font-size: 16px; }
  .row.done .name { color: var(--muted); text-decoration: line-through; }
  .chip {
    flex: none;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: color-mix(in srgb, var(--a) 14%, transparent);
    color: var(--a);
    font-variant-numeric: tabular-nums;
  }

  .fields { display: flex; gap: 10px; margin: 10px 0 0 38px; align-items: center; flex-wrap: wrap; }
  .fields label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  input[type="text"], input[type="number"] {
    width: 74px;
    padding: 9px 10px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--field);
    color: var(--fg);
    font: inherit; font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  input::placeholder { color: var(--muted); opacity: .55; }
  .prev { margin: 6px 0 0 38px; font-size: 12px; color: var(--muted); }

  /* Kalorije */
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .datenav button {
    width: 40px; height: 40px;
    border: 0; border-radius: 12px;
    background: var(--card);
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  .datenav button:disabled { opacity: .35; cursor: default; }
  .datenav span { font-weight: 600; }

  .summary { background: var(--card); border-radius: 18px; padding: 18px 16px 16px; margin-bottom: 12px; }
  .big { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .big small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
  .remain { font-size: 14px; color: var(--muted); margin: 4px 0 12px; }
  .summary.over .big, .summary.over .remain { color: var(--danger); }
  .summary.over .bar i { background: var(--danger); }
  .summary .bar { margin-bottom: 14px; }
  .goal { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .goal input { width: 90px; }

  .add { display: flex; gap: 8px; margin-bottom: 10px; }
  .add input[type="text"] { flex: 1; width: auto; min-width: 0; }
  .add input[type="number"] { width: 84px; }
  .btn {
    padding: 0 16px;
    border: 0; border-radius: 10px;
    background: var(--a); color: #fff;
    font-weight: 600; cursor: pointer;
  }
  .recents { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .recents button {
    padding: 6px 11px;
    border: 0; border-radius: 999px;
    background: color-mix(in srgb, var(--a) 14%, transparent);
    color: var(--a);
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .entry { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .entry .k { font-variant-numeric: tabular-nums; font-weight: 600; }
  .entry .x {
    width: 32px; height: 32px;
    border: 0; border-radius: 8px;
    background: transparent; color: var(--muted);
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; font-size: 14px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Meni">
  <div class="brand"><span class="logo" data-icon="dumbbell"></span>Fitnes</div>
  <button class="nav-item" id="nav-workout" type="button" style="--ic:#5b6cff"><span data-icon="dumbbell"></span>Trening</button>
  <button class="nav-item" id="nav-cal" type="button" style="--ic:#f59e0b"><span data-icon="flame"></span>Kalorije</button>
  <hr>
  <button class="nav-item" id="export" type="button"><span data-icon="download"></span>Izvozi podatke</button>
  <button class="nav-item" id="import" type="button"><span data-icon="upload"></span>Uvozi podatke</button>
  <input id="file" type="file" accept="application/json" hidden>
  <div class="foot">Podatki so shranjeni v tem brskalniku. Za varnostno kopijo uporabi izvoz.</div>
</aside>

<main>
  <header>
    <button class="burger" id="burger" type="button" aria-label="Odpri meni" aria-expanded="false" aria-controls="drawer"><span data-icon="menu"></span></button>
    <div class="titles">
      <h1 id="title">Trening</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <span class="logo" id="logo" data-icon="dumbbell"></span>
  </header>
  <div id="view"></div>
</main>

<script>
/* ---- Načrt: tukaj spreminjaš vaje ---- */
const DAYS = [
  { id: 'ned', label: 'Ned', title: 'Nedelja · Zgornji A', color: '#5b6cff', ex: [
    ['Chest press', '3×6–10'],
    ['Seated row (stroj)', '3×8–12'],
    ['Incline chest press', '3×8–12'],
    ['Pec deck', '3×10–15'],
    ['Lateral raises', '3×12–15'],
    ['Triceps pushdown', '3×10–12'],
    ['Preacher curls', '3×8–12']
  ]},
  { id: 'pon', label: 'Pon', title: 'Ponedeljek · Spodnji A', color: '#10b981', ex: [
    ['Leg press', '3×8–12'],
    ['Leg extension', '3×10–15'],
    ['Hamstring curl', '3×8–12'],
    ['Adductor', '2×10–15'],
    ['Calf raises', '3×10–15'],
    ['Abs machine', '3×10–15']
  ]},
  { id: 'sre', label: 'Sre', title: 'Sreda · Zgornji B', color: '#a855f7', ex: [
    ['Lat pulldown', '3×8–12'],
    ['Chest-supported row (stroj)', '3×8–12'],
    ['Shoulder press', '3×8–12'],
    ['Rear delt', '3×12–15'],
    ['Lateral raises', '2×12–15'],
    ['Cable biceps', '3×10–12'],
    ['Cuff pushdown', '3×10–15']
  ]},
  { id: 'cet', label: 'Čet', title: 'Četrtek · Spodnji B', color: '#ec4899', ex: [
    ['Hamstring curl', '3×8–12'],
    ['Leg press (nižje/ožje stopalo)', '3×10–12'],
    ['Leg extension', '2×12–15'],
    ['Adductor', '2×10–15'],
    ['Calf raises', '3×10–15'],
    ['Abs machine', '3×10–15']
  ]}
];
const CARDIO = ['Incline walk', '15–20 min'];
const CAL_COLOR = '#f59e0b';
/* ------------------------------------- */

const ICONS = {
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  flame: '<path d="M12 3c.5 3.5 4.5 5.5 4.5 10a4.5 4.5 0 0 1-9 0c0-1.8.8-3 1.8-4 .3 1.2 1 2 1.9 2.3C11 8.5 11 5.5 12 3z"/>',
  download: '<path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 20h14"/>',
  upload: '<path d="M12 16V5M7.5 9 12 4.5 16.5 9M5 20h14"/>'
};
function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2');
  s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  s.setAttribute('aria-hidden', 'true');
  s.innerHTML = ICONS[name]; // statični konstanti zgoraj
  return s;
}
function paintIcons(root) {
  root.querySelectorAll('[data-icon]').forEach(n => {
    if (!n.firstChild) n.append(icon(n.dataset.icon));
  });
}

const KEY = 'fitnes-v1';
let db = load();
let view = 'workout';
let current = pickDay();
const today = ymd(new Date());
let calDate = today;

function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  d = d && typeof d === 'object' ? d : {};
  if (!d.weeks || typeof d.weeks !== 'object') d.weeks = {};
  if (!d.cal || typeof d.cal !== 'object') d.cal = {};
  if (!d.cal.days || typeof d.cal.days !== 'object') d.cal.days = {};
  if (d.cal.goal == null) d.cal.goal = '';
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
}

function p2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function shift(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }

// Teden se začne v nedeljo (prvi trening).
function weekStart(d) {
  return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay()));
}
const WEEK = weekStart(new Date());

function pickDay() {
  const map = { 0: 'ned', 1: 'pon', 2: 'sre', 3: 'sre', 4: 'cet', 5: 'ned', 6: 'ned' };
  return map[new Date().getDay()];
}

function entry(key) {
  db.weeks[WEEK] = db.weeks[WEEK] || {};
  return db.weeks[WEEK][key] = db.weeks[WEEK][key] || {};
}
function previous(key) {
  const weeks = Object.keys(db.weeks).filter(w => w < WEEK).sort().reverse();
  for (const w of weeks) {
    const e = db.weeks[w][key];
    if (e && (e.kg || e.reps || e.min)) return e;
  }
  return null;
}

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'style') n.style.cssText = attrs[k];
    else if (k in n) n[k] = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  kids.forEach(c => n.append(c));
  return n;
}

function setAccent(c) {
  document.documentElement.style.setProperty('--a', c);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', c);
}

/* ---------- Meni ---------- */
const burger = document.getElementById('burger');
function openMenu(open) {
  document.body.classList.toggle('menu-open', open);
  burger.setAttribute('aria-expanded', open);
  if (open) document.getElementById('nav-' + (view === 'workout' ? 'workout' : 'cal')).focus();
  else burger.focus();
}
burger.onclick = () => openMenu(!document.body.classList.contains('menu-open'));
document.getElementById('scrim').onclick = () => openMenu(false);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('menu-open')) openMenu(false);
});
function go(v) {
  view = v;
  document.body.classList.remove('menu-open');
  burger.setAttribute('aria-expanded', false);
  render();
}
document.getElementById('nav-workout').onclick = () => go('workout');
document.getElementById('nav-cal').onclick = () => go('cal');

/* ---------- Trening ---------- */
function renderWorkout(root) {
  const day = DAYS.find(d => d.id === current);
  setAccent(day.color);

  const tabs = el('div', { class: 'tabs', role: 'tablist' });
  DAYS.forEach(d => {
    const b = el('button', { type: 'button', class: 'tab', role: 'tab', textContent: d.label, style: '--tc:' + d.color });
    b.setAttribute('aria-selected', d.id === current);
    b.onclick = () => { current = d.id; render(); };
    tabs.append(b);
  });

  const progress = el('span', { class: 'progress' });
  const bar = el('i');
  root.append(
    tabs,
    el('div', { class: 'day-head' }, el('span', { class: 'day-title', textContent: day.title }), progress),
    el('div', { class: 'bar' }, bar)
  );

  const items = day.ex.map(([name, sets]) => ({ name, sets, key: day.id + ':' + name, cardio: false }));
  items.push({ name: CARDIO[0], sets: CARDIO[1], key: day.id + ':cardio', cardio: true });

  function updateProgress() {
    const done = items.filter(i => entry(i.key).done).length;
    progress.textContent = done + ' / ' + items.length;
    bar.style.width = (done / items.length * 100) + '%';
  }

  const card = el('div', { class: 'card' });
  items.forEach(it => {
    const e = entry(it.key);
    const prev = previous(it.key);
    const row = el('div', { class: 'row' + (e.done ? ' done' : '') });

    const cb = el('input', { type: 'checkbox', class: 'check', checked: !!e.done });
    cb.setAttribute('aria-label', it.name);
    cb.onchange = () => {
      entry(it.key).done = cb.checked;
      row.classList.toggle('done', cb.checked);
      save(); updateProgress();
    };
    row.append(el('div', { class: 'top' },
      cb,
      el('span', { class: 'name', textContent: it.name }),
      el('span', { class: 'chip', textContent: it.sets })
    ));

    const fields = el('div', { class: 'fields' });
    if (it.cardio) {
      const min = el('input', { type: 'number', inputMode: 'numeric', min: 0, placeholder: prev && prev.min ? prev.min : '0', value: e.min || '' });
      min.oninput = () => { entry(it.key).min = min.value; save(); };
      fields.append(el('label', {}, min, 'min'));
    } else {
      const kg = el('input', { type: 'number', inputMode: 'decimal', step: 'any', min: 0, placeholder: prev && prev.kg ? prev.kg : '0', value: e.kg || '' });
      const reps = el('input', { type: 'text', inputMode: 'numeric', placeholder: prev && prev.reps ? prev.reps : '0', value: e.reps || '' });
      kg.oninput = () => { entry(it.key).kg = kg.value; save(); };
      reps.oninput = () => { entry(it.key).reps = reps.value; save(); };
      fields.append(el('label', {}, kg, 'kg'), el('label', {}, reps, 'ponovitev'));
    }
    row.append(fields);

    if (prev) {
      const txt = it.cardio
        ? 'prejšnjič ' + (prev.min || '–') + ' min'
        : 'prejšnjič ' + (prev.kg || '–') + ' kg × ' + (prev.reps || '–');
      row.append(el('div', { class: 'prev', textContent: txt }));
    }
    card.append(row);
  });
  root.append(card);
  updateProgress();

  const [, m, d] = WEEK.split('-');
  setHeader('Trening', 'Teden od ' + Number(d) + '. ' + Number(m) + '.');
}

/* ---------- Kalorije ---------- */
const DAYNAMES = ['Ned', 'Pon', 'Tor', 'Sre', 'Čet', 'Pet', 'Sob'];
function dateLabel(s) {
  if (s === today) return 'Danes';
  if (s === shift(today, -1)) return 'Včeraj';
  const d = parse(s);
  return DAYNAMES[d.getDay()] + ', ' + d.getDate() + '. ' + (d.getMonth() + 1) + '.';
}
function dayEntries(s) { return db.cal.days[s] || (db.cal.days[s] = []); }
function total(s) { return (db.cal.days[s] || []).reduce((a, e) => a + (Number(e.kcal) || 0), 0); }

function recentItems() {
  const seen = new Set(), out = [];
  Object.keys(db.cal.days).sort().reverse().forEach(day => {
    (db.cal.days[day] || []).slice().reverse().forEach(e => {
      if (!e.name) return;
      const k = e.name.toLowerCase() + '|' + e.kcal;
      if (!seen.has(k) && out.length < 8) { seen.add(k); out.push(e); }
    });
  });
  return out;
}

function renderCal(root) {
  setAccent(CAL_COLOR);

  const prevBtn = el('button', { type: 'button', textContent: '‹' });
  prevBtn.setAttribute('aria-label', 'Prejšnji dan');
  prevBtn.onclick = () => { calDate = shift(calDate, -1); render(); };
  const nextBtn = el('button', { type: 'button', textContent: '›', disabled: calDate >= today });
  nextBtn.setAttribute('aria-label', 'Naslednji dan');
  nextBtn.onclick = () => { calDate = shift(calDate, 1); render(); };
  root.append(el('div', { class: 'datenav' }, prevBtn, el('span', { textContent: dateLabel(calDate) }), nextBtn));

  // Povzetek
  const big = el('div', { class: 'big' });
  const remain = el('div', { class: 'remain' });
  const bar = el('i');
  const summary = el('div', { class: 'summary' }, big, remain, el('div', { class: 'bar' }, bar));
  const goalIn = el('input', { type: 'number', inputMode: 'numeric', min: 0, placeholder: '2500', value: db.cal.goal || '' });
  goalIn.oninput = () => { db.cal.goal = goalIn.value; save(); updateSummary(); };
  summary.append(el('label', { class: 'goal' }, 'Dnevni cilj', goalIn, 'kcal'));
  root.append(summary);

  function updateSummary() {
    const t = total(calDate);
    const g = Number(db.cal.goal) || 0;
    big.replaceChildren(String(t), el('small', { textContent: g ? '/ ' + g + ' kcal' : 'kcal' }));
    summary.classList.toggle('over', g > 0 && t > g);
    if (!g) { remain.textContent = 'Nastavi dnevni cilj spodaj.'; bar.style.width = '0'; return; }
    bar.style.width = Math.min(100, t / g * 100) + '%';
    remain.textContent = t > g ? 'Preseženo za ' + (t - g) + ' kcal' : 'Še ' + (g - t) + ' kcal';
  }
  updateSummary();

  // Dodajanje
  const nameIn = el('input', { type: 'text', placeholder: 'Obrok (neobvezno)', maxLength: 60 });
  const kcalIn = el('input', { type: 'number', inputMode: 'numeric', min: 0, placeholder: 'kcal' });
  const addBtn = el('button', { type: 'button', class: 'btn', textContent: 'Dodaj' });

  function add(name, kcal) {
    const k = Math.round(Number(kcal));
    if (!k || k < 0) return false;
    dayEntries(calDate).push({ name: (name || '').trim(), kcal: k });
    save();
    return true;
  }
  function submit() {
    if (add(nameIn.value, kcalIn.value)) { render(); setTimeout(() => nameIn.focus(), 0); }
    else kcalIn.focus();
  }
  addBtn.onclick = submit;
  [nameIn, kcalIn].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
  root.append(el('div', { class: 'add' }, nameIn, kcalIn, addBtn));

  // Zadnje uporabljeno
  const rec = recentItems();
  if (rec.length) {
    const wrap = el('div', { class: 'recents' });
    rec.forEach(r => {
      const b = el('button', { type: 'button', textContent: r.name + ' · ' + r.kcal });
      b.onclick = () => { add(r.name, r.kcal); render(); };
      wrap.append(b);
    });
    root.append(wrap);
  }

  // Seznam
  const list = dayEntries(calDate);
  const card = el('div', { class: 'card' });
  if (!list.length) {
    card.append(el('div', { class: 'empty', textContent: 'Še ni vnosov. Vpiši kalorije zgoraj.' }));
  } else {
    list.forEach((e, i) => {
      const x = el('button', { type: 'button', class: 'x', textContent: '×' });
      x.setAttribute('aria-label', 'Izbriši vnos');
      x.onclick = () => { list.splice(i, 1); save(); render(); };
      card.append(el('div', { class: 'entry' },
        el('span', { class: 'n', textContent: e.name || 'Vnos' }),
        el('span', { class: 'k', textContent: e.kcal + ' kcal' }),
        x
      ));
    });
  }
  root.append(card);

  setHeader('Kalorije', dateLabel(calDate));
}

/* ---------- Skupno ---------- */
function setHeader(t, s) {
  document.getElementById('title').textContent = t;
  document.getElementById('subtitle').textContent = s;
}
function render() {
  const root = document.getElementById('view');
  root.replaceChildren();
  if (view === 'workout') renderWorkout(root); else renderCal(root);
  document.getElementById('nav-workout').setAttribute('aria-current', view === 'workout' ? 'page' : 'false');
  document.getElementById('nav-cal').setAttribute('aria-current', view === 'cal' ? 'page' : 'false');
}

// Izvoz / uvoz
document.getElementById('export').onclick = () => {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: 'fitnes-' + today + '.json' });
  document.body.append(a); a.click(); a.remove();
  openMenu(false);
};
const file = document.getElementById('file');
document.getElementById('import').onclick = () => file.click();
file.onchange = () => {
  const f = file.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || typeof data.weeks !== 'object') throw new Error();
      localStorage.setItem(KEY, JSON.stringify(data));
      db = load();
      openMenu(false);
      render();
    } catch (e) { alert('Datoteka ni veljavna.'); }
  };
  r.readAsText(f);
  file.value = '';
};

paintIcons(document);
render();
</script>
</body>
</html>
